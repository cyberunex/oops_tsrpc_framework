<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle">企业网站 - 首页</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="animated-bg min-vh-100 d-flex flex-column">
    <!-- Header Navigation -->
    <nav class="navbar navbar-expand-lg glass-nav fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-building fa-2x me-2"></i>
                <span data-i18n="companyName">企业名称</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html" data-i18n="navHome">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html" data-i18n="navProducts">产品/服务</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="activities.html" data-i18n="navActivities">专题活动</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="history.html" data-i18n="navHistory">企业大事记</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="feedback.html" data-i18n="navFeedback">反馈招聘</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex align-items-center">
                <div class="dropdown">
                    <button class="btn glass-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-globe"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end glass-effect">
                        <li><a class="dropdown-item" href="#" data-lang="zh-CN">中文</a></li>
                        <li><a class="dropdown-item" href="#" data-lang="en-US">English</a></li>
                        <li><a class="dropdown-item" href="#" data-lang="ja-JP">日本語</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1" style="margin-top: 76px;">
        <!-- Banner Carousel -->
        <section class="container my-4">
            <div id="bannerCarousel" class="carousel slide glass-card rounded" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="2"></button>
                </div>
                <div class="carousel-inner rounded">
                    <div class="carousel-item active">
                        <img src="https://via.placeholder.com/1200x400/23a6d5/ffffff?text=Banner+1" class="d-block w-100 rounded" alt="Banner 1">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 data-i18n="banner1Title">欢迎来到我们的网站</h5>
                            <p data-i18n="banner1Desc">提供优质的产品和服务</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="https://via.placeholder.com/1200x400/e73c7e/ffffff?text=Banner+2" class="d-block w-100 rounded" alt="Banner 2">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 data-i18n="banner2Title">创新技术引领未来</h5>
                            <p data-i18n="banner2Desc">致力于技术创新和发展</p>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="https://via.placeholder.com/1200x400/23d5ab/ffffff?text=Banner+3" class="d-block w-100 rounded" alt="Banner 3">
                        <div class="carousel-caption d-none d-md-block">
                            <h5 data-i18n="banner3Title">专业服务值得信赖</h5>
                            <p data-i18n="banner3Desc">为客户提供全方位的服务</p>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#bannerCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#bannerCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </section>

        <!-- Company Introduction -->
        <section class="container my-4">
            <div class="card glass-card">
                <div class="row g-0">
                    <div class="col-md-4">
                        <img src="https://via.placeholder.com/400x300/ee7752/ffffff?text=Company" class="img-fluid rounded-start h-100 object-fit-cover" alt="Company">
                    </div>
                    <div class="col-md-8">
                        <div class="card-body">
                            <h2 class="card-title" data-i18n="aboutTitle">企业简介</h2>
                            <p class="card-text" data-i18n="aboutDesc">我们是一家专注于创新和发展的企业，致力于为客户提供高质量的产品和服务。多年来，我们始终坚持以客户为中心，不断提升技术水平和服务质量。</p>
                            <p class="card-text"><small class="text-muted" data-i18n="aboutMore">了解更多关于我们...</small></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Features/Services -->
        <section class="container my-4">
            <h2 class="text-center mb-4" data-i18n="featuresTitle">产品特点/服务特点</h2>
            <div class="row g-4" id="featuresContainer">
                <!-- Features will be loaded from JSON -->
            </div>
        </section>

        <!-- Recent News -->
        <section class="container my-4">
            <h2 class="mb-4" data-i18n="newsTitle">最近新闻</h2>
            <div class="list-group" id="newsList">
                <!-- News will be loaded from JSON -->
            </div>
        </section>

        <!-- Contact Information -->
        <section class="container my-4">
            <div class="card glass-card">
                <div class="card-header">
                    <h2 data-i18n="contactTitle">联系方式</h2>
                </div>
                <div class="card-body">
                    <div class="row g-4" id="contactInfo">
                        <!-- Contact info will be loaded from JSON -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="glass-footer py-4 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p class="mb-0" data-i18n="copyright">© 2024 企业名称。All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="#" class="text-decoration-none me-3"><i class="fab fa-weixin fa-lg"></i></a>
                    <a href="#" class="text-decoration-none me-3"><i class="fab fa-weibo fa-lg"></i></a>
                    <a href="#" class="text-decoration-none me-3"><i class="fab fa-linkedin fa-lg"></i></a>
                    <a href="#" class="text-decoration-none"><i class="fab fa-twitter fa-lg"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Floating Buttons -->
    <div class="floating-buttons">
        <button class="btn btn-primary floating-btn glass-btn" type="button" data-bs-toggle="modal" data-bs-target="#chatModal" title="联系客服">
            <i class="fas fa-comments"></i>
        </button>
        <button class="btn btn-secondary floating-btn glass-btn" type="button" data-action="toggle-theme" title="切换主题">
            <i class="fas fa-moon" data-theme-icon></i>
        </button>
        <button class="btn btn-success floating-btn glass-btn" type="button" data-action="scroll-top" style="display: none;" title="回到顶部">
            <i class="fas fa-arrow-up"></i>
        </button>
    </div>

    <!-- Chat Modal -->
    <div class="modal fade chat-modal" id="chatModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="chatTitle">联系客服</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="input-group mt-3">
                        <input type="text" class="form-control" id="chatInput" placeholder="输入消息...">
                        <button class="btn btn-primary" type="button" data-action="send-message">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Load homepage data
        document.addEventListener('DOMContentLoaded', async () => {
            const lang = localStorage.getItem('language') || 'zh-CN';
            const data = await DataLoader.loadPageData('index', lang);
            
            if (data) {
                // Load features
                const featuresContainer = document.getElementById('featuresContainer');
                if (data.features && featuresContainer) {
                    featuresContainer.innerHTML = data.features.map(feature => `
                        <div class="col-md-6 col-lg-3">
                            <div class="card glass-card h-100">
                                <div class="card-body text-center">
                                    <i class="${feature.icon} fa-3x mb-3 text-primary"></i>
                                    <h5 class="card-title">${feature.title}</h5>
                                    <p class="card-text">${feature.description}</p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
                
                // Load news
                const newsList = document.getElementById('newsList');
                if (data.news && newsList) {
                    newsList.innerHTML = data.news.map(item => `
                        <a href="#" class="list-group-item list-group-item-action glass-list">
                            <div class="d-flex w-100 justify-content-between">
                                <h5 class="mb-1">${item.title}</h5>
                                <small>${item.date}</small>
                            </div>
                            <p class="mb-1">${item.summary}</p>
                        </a>
                    `).join('');
                }
                
                // Load contact info
                const contactInfo = document.getElementById('contactInfo');
                if (data.contact && contactInfo) {
                    contactInfo.innerHTML = data.contact.map(item => `
                        <div class="col-md-4">
                            <div class="d-flex align-items-center">
                                <i class="${item.icon} fa-2x text-primary me-3"></i>
                                <div>
                                    <h6 class="mb-0">${item.label}</h6>
                                    <p class="mb-0">${item.value}</p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            }
        });
    </script>
</body>
</html>
