<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle">反馈招聘 - 企业网站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="animated-bg min-vh-100 d-flex flex-column">
    <nav class="navbar navbar-expand-lg glass-nav fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="fas fa-building fa-2x me-2"></i>
                <span data-i18n="companyName">企业名称</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="navHome">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html" data-i18n="navProducts">产品/服务</a></li>
                    <li class="nav-item"><a class="nav-link" href="activities.html" data-i18n="navActivities">专题活动</a></li>
                    <li class="nav-item"><a class="nav-link" href="history.html" data-i18n="navHistory">企业大事记</a></li>
                    <li class="nav-item"><a class="nav-link active" href="feedback.html" data-i18n="navFeedback">反馈招聘</a></li>
                </ul>
            </div>
            <div class="d-flex align-items-center">
                <div class="dropdown">
                    <button class="btn glass-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="fas fa-globe"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end glass-effect">
                        <li><a class="dropdown-item" href="#" data-lang="zh-CN">中文</a></li>
                        <li><a class="dropdown-item" href="#" data-lang="en-US">English</a></li>
                        <li><a class="dropdown-item" href="#" data-lang="ja-JP">日本語</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1" style="margin-top: 76px;">
        <section class="container my-4">
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card glass-card">
                        <div class="card-header">
                            <h4 data-i18n="feedbackTitle"><i class="fas fa-envelope me-2"></i>留言反馈</h4>
                        </div>
                        <div class="card-body">
                            <form id="feedbackForm">
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="nameLabel">姓名</label>
                                    <input type="text" class="form-control" name="name" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="emailLabel">邮箱</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="phoneLabel">电话</label>
                                    <input type="tel" class="form-control" name="phone">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" data-i18n="messageLabel">留言内容</label>
                                    <textarea class="form-control" name="message" rows="4" required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100" data-i18n="submitBtn">提交</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card glass-card">
                        <div class="card-header">
                            <h4 data-i18n="jobsTitle"><i class="fas fa-briefcase me-2"></i>招聘信息</h4>
                        </div>
                        <div class="card-body">
                            <div class="list-group" id="jobsList"></div>
                        </div>
                        <div class="card-footer" id="jobsPagination"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Job Detail Modal -->
    <div class="modal fade" id="jobModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content glass-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="jobModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="jobModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-i18n="applyBtn">申请职位</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="glass-footer py-4 mt-auto">
        <div class="container">
            <div class="row">
                <div class="col-md-6"><p class="mb-0" data-i18n="copyright">© 2024 企业名称。All rights reserved.</p></div>
                <div class="col-md-6 text-md-end">
                    <a href="#" class="text-decoration-none me-3"><i class="fab fa-weixin fa-lg"></i></a>
                    <a href="#" class="text-decoration-none me-3"><i class="fab fa-weibo fa-lg"></i></a>
                    <a href="#" class="text-decoration-none me-3"><i class="fab fa-linkedin fa-lg"></i></a>
                    <a href="#" class="text-decoration-none"><i class="fab fa-twitter fa-lg"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <div class="floating-buttons">
        <button class="btn btn-primary floating-btn glass-btn" type="button" data-bs-toggle="modal" data-bs-target="#chatModal"><i class="fas fa-comments"></i></button>
        <button class="btn btn-secondary floating-btn glass-btn" type="button" data-action="toggle-theme"><i class="fas fa-moon" data-theme-icon></i></button>
        <button class="btn btn-success floating-btn glass-btn" type="button" data-action="scroll-top" style="display: none;"><i class="fas fa-arrow-up"></i></button>
    </div>

    <div class="modal fade chat-modal" id="chatModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="chatTitle">联系客服</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="input-group mt-3">
                        <input type="text" class="form-control" id="chatInput" placeholder="输入消息...">
                        <button class="btn btn-primary" type="button" data-action="send-message"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const lang = localStorage.getItem('language') || 'zh-CN';
        const data = await DataLoader.loadPageData('feedback', lang);
        
        if (data && data.jobs) {
            const jobsList = document.getElementById('jobsList');
            jobsList.innerHTML = data.jobs.map(job => `
                <a href="#" class="list-group-item list-group-item-action glass-list" onclick="showJobDetail('${job.id}'); return false;">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">${job.title}</h5>
                        <small class="text-primary">${job.salary}</small>
                    </div>
                    <p class="mb-1"><i class="fas fa-map-marker-alt me-1"></i>${job.location} | <i class="far fa-clock me-1"></i>${job.type}</p>
                    <small class="text-muted">${job.posted}</small>
                </a>
            `).join('');

            window.showJobDetail = function(id) {
                const job = data.jobs.find(j => j.id === id);
                if (job) {
                    document.getElementById('jobModalTitle').textContent = job.title;
                    document.getElementById('jobModalBody').innerHTML = `
                        <div class="mb-3">
                            <strong><i class="fas fa-money-bill me-2"></i>${data.salaryLabel || '薪资'}:</strong> ${job.salary}
                        </div>
                        <div class="mb-3">
                            <strong><i class="fas fa-map-marker-alt me-2"></i>${data.locationLabel || '地点'}:</strong> ${job.location}
                        </div>
                        <div class="mb-3">
                            <strong><i class="far fa-clock me-2"></i>${data.typeLabel || '类型'}:</strong> ${job.type}
                        </div>
                        <div class="mb-3">
                            <strong><i class="fas fa-list me-2"></i>${data.requirementsLabel || '要求'}:</strong>
                            <ul>${job.requirements.map(r => `<li>${r}</li>`).join('')}</ul>
                        </div>
                        <div>
                            <strong><i class="fas fa-tasks me-2"></i>${data.responsibilitiesLabel || '职责'}:</strong>
                            <p>${job.responsibilities}</p>
                        </div>
                    `;
                    new bootstrap.Modal(document.getElementById('jobModal')).show();
                }
            };
        }

        // Form submit
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const feedback = Object.fromEntries(formData);
            let submissions = JSON.parse(localStorage.getItem('feedbackSubmissions') || '[]');
            submissions.push({...feedback, date: new Date().toISOString()});
            localStorage.setItem('feedbackSubmissions', JSON.stringify(submissions));
            alert(data.submitSuccess || '提交成功！我们会尽快回复您。');
            this.reset();
        });
    });
    </script>
</body>
</html>
